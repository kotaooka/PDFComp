name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test.mjs
      - name: ローカル版が最新か確かめる
        run: |
          node tools/build-local.mjs
          git diff --exit-code -- local/
